<style>
:root{
 --bg:#faf7f2;--card:#fff;--ink:#201d18;--mut:#867d72;--line:#ece5db;--soft:#f4efe7;
 --grn:#3f6b52;--grns:#e9f0eb;--wrm:#b0603a;--wrms:#f8ece5;--blu:#3c5a78;--blus:#e8eef4;
 --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
@media(prefers-color-scheme:dark){:root{
 --bg:#131110;--card:#1e1b18;--ink:#f3eee6;--mut:#9c9287;--line:#2f2922;--soft:#262119;
 --grn:#86baa0;--grns:#1e2b24;--wrm:#df9a74;--wrms:#2f2019;--blu:#93b4d2;--blus:#1b232c;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + var(--sb))}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--st) + 14px) 18px 10px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.025em}
.mt{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:10px}
.mt span{font-size:13px;color:var(--mut)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:20px;background:var(--wrms);color:var(--wrm);white-space:nowrap}
.days{display:flex;gap:5px;padding:11px 14px 3px;max-width:660px;margin:0 auto}
.d{flex:1;text-align:center;padding:7px 0;border-radius:11px;font-size:11px;font-weight:650;
 color:var(--mut);background:var(--card);border:1px solid var(--line)}
.d.on{background:var(--grn);border-color:var(--grn);color:var(--bg)}
.d b{display:block;font-size:14px;margin-top:1px}
main{padding:8px 14px 24px;max-width:660px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px}
.c h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:0 0 12px;font-weight:750}
.it{display:flex;align-items:flex-start;gap:12px;padding:9px 0;min-height:42px}
.bx{flex:none;width:23px;height:23px;margin-top:1px;border:2px solid var(--line);border-radius:7px;position:relative;transition:.15s}
.it.on .bx{background:var(--grn);border-color:var(--grn)}
.it.on .bx::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.ic{flex:none;width:25px;text-align:center;font-size:18px;line-height:1.3;margin-top:1px}
.lb{flex:1;font-size:15.5px}
.lb small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.45}
.it.on .lb>b{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:400}
.lb b{font-weight:500}
.tg{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;background:var(--blus);color:var(--blu);font-weight:750;align-self:center;flex:none}
.tg.w{background:var(--wrms);color:var(--wrm)}
.tiers{display:flex;gap:6px;margin-bottom:14px}
.tr{flex:1;text-align:center;padding:9px 4px;border-radius:11px;border:1.5px solid var(--line);font-size:12.5px;font-weight:650;color:var(--mut)}
.tr.on{border-color:var(--grn);background:var(--grns);color:var(--grn)}
.sess{font-size:15px;line-height:1.6;background:var(--soft);border-radius:12px;padding:14px 15px}
.sess .h{font-size:16.5px;font-weight:680;margin-bottom:7px;letter-spacing:-.01em}
.glass{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;justify-items:center}
.g{width:100%;max-width:44px;aspect-ratio:1/1.1;display:block;overflow:visible}
.g path{fill:none;stroke:var(--line);stroke-width:1.5;transition:fill .18s,stroke .18s}
.g.on path{fill:var(--grns);stroke:var(--grn)}
.g.on{filter:drop-shadow(0 1px 2px rgba(63,107,82,.18))}
.tot{margin-top:11px;font-size:13.5px;color:var(--mut)}
.tot b{color:var(--ink);font-weight:700}
input,textarea,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);
 border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:9px;resize:vertical;-webkit-appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--grn)}
.tip{background:var(--wrms);border-radius:12px;padding:13px 15px;margin-top:11px;font-size:14.5px;line-height:1.5}
.tip b.h{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--wrm);margin-bottom:6px;font-weight:750}
.tip .a{color:var(--mut);font-size:13px;margin-top:7px}
.warn{background:var(--blus);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55;margin-top:11px}
.warn b.h{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--blu);margin-bottom:6px;font-weight:750}
.r{display:flex;gap:10px;padding:7px 0;font-size:14.5px;line-height:1.5;align-items:flex-start}
.r i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--grn);margin-top:8px}
.q{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14.5px;border-bottom:1px solid var(--line);align-items:baseline}
.q:last-child{border:0}
.q .qi{margin-right:7px}
.q em{font-style:normal;font-size:12px;color:var(--mut);white-space:nowrap;flex:none}
.q.on{color:var(--mut)}
.ph{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border:0}
.ph .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--mut);
 display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:750}
.ph.now .n{background:var(--grn);color:var(--card)}
.ph .t{font-size:15px;font-weight:620}
.ph .s{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid2 input{margin-top:0}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:5px;display:block}
.bar{height:7px;border-radius:20px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar div{height:100%;background:var(--grn);border-radius:20px;transition:.3s}
button{font:inherit;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:11px;
 border:1px solid var(--line);background:var(--card);color:var(--mut);margin-top:10px;margin-right:7px}
button.p{background:var(--grn);border-color:var(--grn);color:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
 background:color-mix(in srgb,var(--card) 90%,transparent);
 backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
 border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav div{flex:1;text-align:center;padding:10px 0 8px;font-size:10.5px;font-weight:650;color:var(--mut)}
nav div.on{color:var(--grn)}
nav div s{display:block;font-size:17px;text-decoration:none;margin-bottom:2px;line-height:1}
.note{font-size:12.5px;color:var(--mut);line-height:1.55}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:30px;text-align:center}
#gate .mk{width:70px;height:70px;border-radius:21px;background:var(--grn);display:flex;
 align-items:center;justify-content:center;margin-bottom:20px;font-size:34px}
#gate h3{margin:0 0 6px;font-size:20px;font-weight:680;letter-spacing:-.02em}
#gate p{margin:0 0 22px;font-size:14px;color:var(--mut);max-width:250px;line-height:1.5}
#gate input{width:170px;text-align:center;font-size:26px;letter-spacing:.35em;padding:14px 10px;font-weight:600;margin:0}
#gate .err{color:var(--wrm);font-size:13px;height:18px;margin-top:12px;font-weight:600}

</style>
</head>
<body>


<div id="gate">
  <div class="mk">🌱</div>
  <h3>Track</h3>
  <p>Enter your passcode.</p>
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
  <div class="err" id="perr"></div>
</div>

<div class="top">
  <h1 id="ttl">Today</h1>
  <div class="mt"><span id="sub"></span><span class="pill" id="cd"></span></div>
</div>
<div class="days" id="days"></div>
<main id="main"></main>
<nav id="nav"></nav>

<script>
/* ==========================================================
   PASSCODE - change these digits and re-upload to change it.
   ========================================================== */
var PIN = "3333";
/* ========================================================== */
(function(){
  var g=document.getElementById("gate"),i=document.getElementById("pin"),e=document.getElementById("perr");
  var ok=false; try{ok=localStorage.getItem("trk-ok")==="1"}catch(x){}
  if(ok){g.style.display="none"}else{setTimeout(function(){i.focus()},350)}
  i.addEventListener("input",function(){
    if(i.value.length>=PIN.length){
      if(i.value===PIN){g.style.display="none";try{localStorage.setItem("trk-ok","1")}catch(x){}}
      else{e.textContent="Not that one.";i.value=""}
    }else{e.textContent=""}
  });
})();
</script>

  w.push({k:"saladprep",i:"🥡",n:"Prep the salad boxes",s:"Enough for the week's dinners — chop, box, done",tg:"weekend",tgw:1});
  w.push({k:"oil",i:"💆",n:"Hair oiling",s:"Either weekend day",tg:"weekend",tgw:1});
  w.push({k:"drill",i:"🗣️",n:"Advocacy drill — 45 min",s:"Argue blind, eight questions, score",tg:"weekend",tgw:1});
  w.push({k:"wrev",i:"📝",n:"Review the week",tg:"weekend",tgw:1});
 }
 var m=[{k:"judgment",i:"📜",n:"Read a judgment",s:"One a day, however short"},
        {k:"book",i:"📚",n:"Read a book",s:"Even ten pages counts"}];
 return {a:a,n:n,w:w,m:m};
}

/* ---------- render ---------- */
function render(){
 var s=st(), p=phase(), td=new Date().getDay(), I=todayItems();
 document.getElementById("ttl").textContent={today:"Today",plan:"The plan",food:"Food",law:"Law",me:"Me"}[tab];
 document.getElementById("sub").textContent=FL[view]+(view===td?" · today":"")+" · Phase "+p.n;
 document.getElementById("cd").textContent=daysLeft()+" days to 20 Dec";
 document.getElementById("days").innerHTML=DS.map(function(d,i){
  var o=S[i]||{},c=0;for(var k in o){if(k!=="w"&&k!=="t"&&o[k]===true)c++}
  return '<div class="d'+(i===view?" on":"")+'" onclick="gd('+i+')">'+d+'<b>'+(c||"·")+'</b></div>'}).join("");

 var h="";

 if(tab==="today"){
  var cy=CYCLE[view];
  h+='<div class="c"><h2>'+cy.i+' '+cy.f+'</h2><div class="tiers">'+
   ["B","G","E"].map(function(t){return '<div class="tr'+(s.t===t?" on":"")+'" onclick="gt2(\''+t+'\')">'+TIER[t][0]+'</div>'}).join("")+
   '</div><div class="sess"><div class="h">'+cy.i+' '+cy.f+'</div>'+cy[s.t]+
   (cy.c!=="rest"&&p.n>1?'<div style="margin-top:9px;color:var(--mut);font-size:13.5px">Phase '+p.n+' — '+p.mod+'</div>':'')+
   '</div></div>';

  h+='<div class="c"><h2>💧 Water · 200 ml a drop</h2><div class="glass">'+
   Array.from({length:15},function(_,i){return '<svg class="g'+(i<s.w?" on":"")+'" viewBox="0 0 24 26" onclick="pw('+i+')">'+
    '<path d="M12 2.4C12 2.4 4.6 10.8 4.6 15.6a7.4 7.4 0 0 0 14.8 0C19.4 10.8 12 2.4 12 2.4Z"/></svg>'}).join("")+
   '</div><div class="tot"><b>'+(s.w*200)+' ml</b> of 3000 · '+(15-s.w)+' to go</div>'+
   '<div class="bar"><div style="width:'+Math.round(s.w/15*100)+'%"></div></div></div>';

  h+='<div class="c"><h2>💊 Medicines</h2>'+MEDS.filter(function(m){return !m.sat||view===6})
      .map(function(m){return row({k:m.k,i:m.i,n:m.n,s:m.s,tg:m.sat?"saturday":"",tgw:1})}).join("")+'</div>';

  h+='<div class="c"><h2>✅ The day</h2>'+I.a.map(row).join("")+'</div>';
  if(I.w.length) h+='<div class="c"><h2>'+(view===0||view===6?"🌤️ Weekend":"🎙️ Practice")+'</h2>'+I.w.map(row).join("")+'</div>';
  h+='<div class="c"><h2>🧠 Mind</h2>'+I.m.map(row).join("")+'</div>';
  h+='<div class="c"><h2>🌙 Night</h2>'+I.n.map(row).join("")+'</div>';
 }

 if(tab==="plan"){
  h+='<div class="c"><h2>🧭 Three phases to 20 December</h2>'+PHASES.map(function(x){
   return '<div class="ph'+(x.n===p.n?" now":"")+'"><div class="n">'+x.n+'</div><div>'+
   '<div class="t">'+x.t+'</div><div class="s">'+fmt(x.from)+' – '+fmt(x.to)+' · '+x.s+'</div></div></div>'}).join("")+
   '<div class="note" style="margin-top:12px">After 20 December the whole thing gets reviewed properly — bloods re-tested, measurements compared, and the plan rewritten from what actually happened rather than carried on out of habit.</div></div>';

  h+='<div class="c"><h2>📆 The training week</h2>'+[1,2,3,4,5,6,0].map(function(i){
   return '<div class="q"><span><span class="qi">'+CYCLE[i].i+'</span>'+CYCLE[i].f+'</span><em>'+FL[i].slice(0,3)+'</em></div>'}).join("")+'</div>';

  h+='<div class="c"><h2>🩹 The elbow</h2>'+
   '<div class="warn"><b class="h">This overrides the page</b>Your physiotherapist\'s instructions come first. If anything here conflicts with what they have told you, follow them, not this.</div>'+
   '<div style="margin-top:13px"><div class="lbl">Avoid until cleared</div>'+
   '<div class="note">Push-ups and any plank on your hands · hanging or dead hangs · loaded biceps curls and triceps extensions · anything that fully straightens the elbow under weight · pushing up from the floor with that arm · locking the elbow out.</div></div>'+
   '<div style="margin-top:13px"><div class="lbl">Fine to do</div>'+
   '<div class="note">All leg and glute work · forearm planks and side planks on the good side · walking, cycling, stairs · core work lying down · light shoulder movement with the elbow bent and supported.</div></div>'+
   '<div class="tip" style="margin-top:13px"><b class="h">Pain is the signal</b>Mild muscle soreness the next day is normal and good. Sharp pain, joint pain, or swelling in the elbow means stop that movement and tell your physio.</div></div>';
 }

 if(tab==="food"){
  var sn=SNACK[view];
  h+='<div class="c"><h2>🍽️ How the day eats now</h2>'+
   '<div class="r"><i></i><div><b>Brunch</b> — morning meal and lunch as one. Make it the biggest thing you eat.</div></div>'+
   '<div class="r"><i></i><div><b>Evening snack</b> — real, not a holdover. It is what stops dinner becoming a second lunch.</div></div>'+
   '<div class="r"><i></i><div><b>Dinner</b> — salad and paneer, finished by 8:30 pm. Built from the boxes you prepped at the weekend, so a late evening never becomes a reason to skip it.</div></div>'+
   '<div class="r"><i></i><div><b>Fruit</b> — one a day. Not within an hour of Megaferon if it is citrus-heavy on an empty stomach.</div></div>'+
   '<div class="r"><i></i><div><b>Protein powder</b> — once daily. On three meals instead of five it is carrying more than it looks.</div></div>'+
   '<div class="tip"><b class="h">Fewer meals, same target</b>Three eating slots have to carry '+TIER[s.t][1]+' g of protein today. That only works if each one is protein-first — the salad and the veg are built around the paneer, not the other way round.</div></div>';

  h+='<div class="c"><h2>🥣 Evening snack · '+FL[view]+'</h2><div class="sess"><div class="h">'+sn[0]+'</div>'+
   '<span style="color:var(--mut)">≈'+sn[1]+' g protein</span><div style="margin-top:7px;color:var(--mut);font-size:13.5px">'+sn[2]+'</div></div>'+
   '<div style="margin-top:13px"><div class="lbl">The rotation</div>'+
   [1,2,3,4,5,6,0].map(function(i){return '<div class="q"><span>'+SNACK[i][0]+'</span><em>'+DS[i]+' · '+SNACK[i][1]+'g</em></div>'}).join("")+'</div></div>';

  h+='<div class="c"><h2>🍳 Brunch options</h2>'+BRUNCH.map(function(x){
   return '<div class="q"><span>'+x[0]+'</span><em>'+x[1]+'g</em></div>'}).join("")+'</div>';
  h+='<div class="c"><h2>🥗 Dinner options</h2>'+DINNER.map(function(x){
   return '<div class="q"><span>'+x[0]+'</span><em>'+x[1]+'g</em></div>'}).join("")+
   '<div class="note" style="margin-top:12px">No sugar in tea or coffee — that one is settled, so it is not tracked. No tea or coffee within an hour of Megaferon.</div></div>';
 }

 if(tab==="law"){
  h+='<div class="c"><h2>⚖️ Courtroom listening</h2>'+
   '<div class="note">Fifteen minutes, any bench, weekdays. The cheapest advocacy education there is — and the only one that shows you what fails.</div>'+
   '<input placeholder="Which court, which matter?" value="'+(s.ct||"")+'" oninput="fl(\'ct\',this.value)">'+
   '<textarea rows="2" placeholder="One line — what the Bench did that you would copy, or avoid">'+(s.cn||"")+'</textarea></div>';

  h+='<div class="c"><h2>The week\'s shape</h2>'+
   '<div class="q"><span>Reading — statute, then prior authority</span><em>Mon–Thu 7 am</em></div>'+
   '<div class="q"><span>Write the three prep items</span><em>Fri</em></div>'+
   '<div class="q"><span>The drill — argue blind, 45 min</span><em>Sat / Sun</em></div>'+
   '<div class="tip"><b class="h">The three prep items</b>The opening proposition, in one sentence. Three concessions you will give, and the one you will not. The three questions you least want asked.'+
   '<div class="a">Written down, on Friday. Every rubric line that failed in the first session traced back to skipping these.</div></div></div>';

  h+='<div class="c"><h2>📁 Where the drill lives</h2><div class="note">The case queue, the rubric and the running log are in your <b>SCR</b> folder — <b>Advocacy Drill — Protocol.md</b> and <b>Advocacy Log.md</b>. Fourteen cases, one a week, which lands just inside 20 December.</div></div>';
 }

 if(tab==="me"){
  var done=0,tot=0;for(var i=0;i<7;i++){var o=S[i]||{};for(var k in o){if(o[k]===true)done++}}
  h+='<div class="c"><h2>📈 This week</h2><div class="tot"><b>'+done+'</b> things ticked across the week</div>'+
   '<div class="bar"><div style="width:'+Math.min(100,Math.round(done/70*100))+'%"></div></div>'+
   '<div class="note" style="margin-top:12px">Day chips at the top show each day\'s count. Tap a day to go back and fill it in.</div></div>';

  h+='<div class="c"><h2>📏 Measurements</h2><div class="grid2">'+
   ['weight|Weight (kg)','waist|Waist (cm)','hips|Hips (cm)','thigh|Thigh (cm)'].map(function(x){
    var a=x.split("|");return '<div><span class="lbl">'+a[1]+'</span><input inputmode="decimal" value="'+(M[a[0]]||"")+'" oninput="mm(\''+a[0]+'\',this.value)"></div>'}).join("")+
   '</div><div class="note" style="margin-top:12px">Once a fortnight, same morning, same conditions. The tape tells you things the scale will not.</div></div>';

  h+='<div class="c"><h2>📝 Week review</h2>'+
   '<div class="r"><i></i><div>Which rubric line slipped again?</div></div>'+
   '<div class="r"><i></i><div>What got read, and what did not?</div></div>'+
   '<div class="r"><i></i><div>How many days hit 3 litres?</div></div>'+
   '<div class="r"><i></i><div>Did anything go up — a rep, a round, a kilo?</div></div>'+
   '<textarea rows="4" placeholder="This week, honestly…" oninput="mm(\'rev\',this.value)">'+(M.rev||"")+'</textarea></div>';

  var lb=M.lastbk?Math.floor((new Date()-new Date(M.lastbk))/864e5):null;
  var warn=(lb===null||lb>14);
  h+='<div class="c"><h2>💾 Backup</h2>'+
   '<div class="sess" style="background:'+(warn?'var(--wrms)':'var(--grns)')+';color:'+(warn?'var(--wrm)':'var(--grn)')+';font-weight:600;font-size:14.5px">'+
   (lb===null?'☁️ Never backed up. Do it now — it takes one tap.':
    lb===0?'☁️ Backed up today. Nothing to do.':
    lb>14?'⚠️ Last backed up '+lb+' days ago. Overdue.':'☁️ Last backed up '+lb+' day'+(lb===1?'':'s')+' ago.')+'</div>'+
   '<button class="p" onclick="bk()">☁️ Back up now</button>'+
   '<div class="note" style="margin-top:12px">Opens the share sheet — send it to <b>Notes</b> or <b>Files</b> and it is safe in iCloud. Everything here lives on this phone only, so this is the only copy that survives a Safari wipe.</div>'+
   '<textarea rows="3" id="bk" placeholder="To restore: paste a backup here, then tap Restore."></textarea>'+
   '<button onclick="im()">Restore</button></div>';
 }

 document.getElementById("main").innerHTML=h;
 document.getElementById("nav").innerHTML=TABS.map(function(x){
  return '<div class="'+(x[0]===tab?"on":"")+'" onclick="gt(\''+x[0]+'\')"><s>'+x[2]+'</s>'+x[1]+'</div>'}).join("");
 sv();
}

function fmt(d){return d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}
function tk(k){var s=st();s[k]=!s[k];render()}
function pw(i){var s=st();s.w=(s.w===i+1)?i:i+1;render()}
function fl(k,v){st()[k]=v;sv()}
function mm(k,v){M[k]=v;sv()}
function gd(i){view=i;render()}
function gt(t){tab=t;window.scrollTo(0,0);render()}
function gt2(t){st().t=t;render()}
function bk(){
 var j=JSON.stringify({S:S,M:M,saved:new Date().toISOString().slice(0,10)});
 M.lastbk=new Date().toISOString().slice(0,10); sv();
 var done=function(){render()};
 if(navigator.share){navigator.share({title:"Track backup",text:j}).then(done,function(){cp(j);done()})}
 else{cp(j);done()}
}
function cp(t){
 var b=document.getElementById("bk"); if(b){b.value=t}
 try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}
}
function im(){var b=document.getElementById("bk");try{var o=JSON.parse(b.value);S=o.S||{};M=o.M||{};sv();render()}catch(e){b.value="That does not look like a backup — paste the exported text and try again.";b.style.borderColor="var(--wrm)"}}

ld();render();
</script>
</body>
</html>
